name: CI

on:
  push:
  pull_request:

jobs:
  # The command a developer runs: build every package in the development container and run its
  # tests.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The image takes about 20 minutes to build from nothing, so its layers are cached between
      # runs in GitHub's cache. Docker's default builder can't write there, so the step creates a
      # builder that can and names it to docker build; the runtime action gives the step the token
      # the cache needs. --load puts the image in Docker for tools/dev.sh to run.
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and test
        env:
          BUILDX_BUILDER: cache-builder
          DOCKER_BUILD_OPTIONS: --cache-from type=gha --cache-to type=gha,mode=max --load
        run: |
          docker buildx create --name "$BUILDX_BUILDER" --driver docker-container
          tools/dev.sh test
