name: CI

on:
  push:
  pull_request:

jobs:
  # The command a developer runs: build every package in the development container and run its
  # tests.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The image takes about 10 minutes to build from nothing, so its layers are cached between
      # runs in GitHub's cache: buildx can write there, and the runtime action gives the build step
      # the token it needs. --load puts the image in Docker for tools/dev.sh to run.
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and test
        env:
          DOCKER_BUILD_OPTIONS: --cache-from type=gha --cache-to type=gha,mode=max --load
        run: tools/dev.sh test
